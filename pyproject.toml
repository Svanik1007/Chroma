[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swcf"
version = "1.0.0"
description = "Spatially-Weighted Chrominance Fusion educational rPPG prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "opencv-contrib-python>=4.8,<5", "mediapipe>=0.10.30,<0.11", "matplotlib>=3.8,<4"]

[project.scripts]
swcf = "swcf.app:main"

[tool.setuptools.packages.find]
include = ["swcf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
