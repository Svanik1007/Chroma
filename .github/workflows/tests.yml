name: Windows tests and synthetic demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install --timeout 120 -r requirements-dev.txt

      - name: Download pretrained face-landmarker model
        run: python main.py download-model

      - name: Run automated tests
        run: python -m pytest -q

      - name: Run synthetic demo without a camera
        run: python main.py demo --headless --duration 8 --output outputs/ci-demo

      - name: Save synthetic demo artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo
          path: outputs/ci-demo/
          retention-days: 7
